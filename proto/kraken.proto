syntax = "proto3";

package kraken;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.kraken";
option java_outer_classname = "KrakenProto";
option objc_class_prefix = "KP";

message SetIFGain {
    float gain = 1;
}

message SetDAQFrequency {
    float freq = 1;
}

message DOAAngles {
    float a = 1;
    float b = 2;
}

message DOAArray {
    repeated DOAAngles destinations = 1;
}

message DOAResult {
    float freq = 1;
    DOAArray res = 2;
}

message SpectrumData {
    float freq = 1;
    float samp = 2;
    repeated float spec = 3 [packed = true];
}

message ClassificationData {
    repeated string names = 1;
    repeated float probs = 2;
}

// ---- запись сигнала ----
message SetRecordingRequest {
    bool enabled = 1;
    string filename = 2;
}

message SetRecordingResponse {
    bool enabled = 1;
    string path = 2;
    int64 frames_written = 3;
}

// ---- MUSIC threshold ----
message MusicThresholdResponse {
    float threshold_db = 1;
    bool  success      = 2;
}

message MusicThresholdRequest {
    float threshold_db = 1;
}

// ---- пресеты антенных блоков ----
message AntennaPresetInfo {
    string key    = 1;
    string name   = 2;
    bool   active = 3;
}

message AntennaPresetList {
    repeated AntennaPresetInfo presets = 1;
}

message SetAntennaPresetRequest {
    string key = 1;
}

message SetAntennaPresetResponse {
    bool   success = 1;
    string key     = 2;
    string name    = 3;
}

// ---- MUSIC-спектр (heatmap) ----
message MusicSpectrumData {
    float  freq    = 1;
    int32  n_az    = 2;
    int32  n_el    = 3;
    bytes  levels  = 4;
    float  az_min  = 5;
    float  az_max  = 6;
    float  el_min  = 7;
    float  el_max  = 8;
}

service Kraken {
    rpc stop(google.protobuf.Empty) returns (google.protobuf.Empty) {}
    rpc setIfGain(SetIFGain) returns (SetIFGain) {}
    rpc setDaqFrequency(SetDAQFrequency) returns (SetDAQFrequency) {}
    rpc getDoaResult(google.protobuf.Empty) returns (stream DOAResult) {}
    rpc getSpectrum(google.protobuf.Empty) returns (stream SpectrumData) {}
    rpc getClassification(google.protobuf.Empty) returns (stream ClassificationData) {}
    rpc setRecording(SetRecordingRequest) returns (SetRecordingResponse) {}

    rpc getMusicThreshold(google.protobuf.Empty) returns (MusicThresholdResponse) {}
    rpc setMusicThreshold(MusicThresholdRequest) returns (MusicThresholdResponse) {}

    rpc getMusicSpectrum(google.protobuf.Empty) returns (stream MusicSpectrumData) {}

    rpc getAntennaPresets(google.protobuf.Empty) returns (AntennaPresetsResponse) {}
    rpc setAntennaPreset(SetAntennaPresetRequest) returns (AntennaPresetsResponse) {}
}
message AntennaPreset {
  string key = 1;
  string displayName = 2;
}

message AntennaPresetsResponse {
  bool success = 1;
  string current = 2;
  repeated AntennaPreset availableList = 3;
}
